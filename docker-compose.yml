# AgentXploit — Docker Compose (prod mode)
#
# Prod mode — backend + frontend only, connects to an external Ollama instance.
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up --build
#
# Dev mode — includes local Ollama + model bootstrap:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# URLs once running:
#   Frontend  → http://localhost:8501
#   Backend   → http://localhost:8000  (Swagger: http://localhost:8000/docs)

services:

  # ── Backend: FastAPI REST API ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_HOST=${OLLAMA_URL:-http://localhost:11434}
      - DB_PATH=/data/agentxploit.db
    volumes:
      - db_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Frontend: Streamlit UI ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  db_data:   # SQLite database with session and message history
